{% extends 'base.html' %}
{% import "macro.jinja2" as todo_macros %}

{% block content %}
    {% set num_todos = todos | length %}
    {% if num_todos > 0 %}
        <p>You have {{ num_todos }} things to do today.</p>
        {{ todo_macros.todo_list(todos) }}
    {% else %}
        <p>Nothing to do today. Relax!</p>
    {% endif %}
{% endblock %}
