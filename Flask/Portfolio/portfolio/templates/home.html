{% extends "base.html" %}

{% block content %}
    <div class="main main--home">
        <section class="projects">
            {% for project in projects %}
                <a href="#" class="u-brare-link">
                    <article class="project-card">
                        <img src="{{ url_for('static', filename=project['thumb']) }}" alt="{{ project['name'] }} hero image" class="project-card__image">
                        <header class="project-card__meta">
                            <ul class="categories"> 
                                {% for category in project["categories"] %}
                                    <li class="categories__tag">
                                        {{ category in project["categories"] }}
                                            <li class="categories__tag">{{ category }}</li>
                                        {{ endfor }}
                                    </li>
                                {% endfor %}
                            </ul>
                            <h2 class="project-card__name">{{ project['name'] }}</h2>
                        </header>
                    </article>
                </a>
            {% endfor %}
        </section>
    </div>
{% endblock %}
